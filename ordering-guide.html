<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153e31"><title>購餐指南 | SORA ZEN</title><link rel="stylesheet" href="style.css"><style>.guide-page{max-width:1040px;margin:auto;padding:30px 18px 70px}.guide-page h1{font-size:clamp(26px,5vw,42px);color:#153e31}.guide-page p{color:#63736b}.guide-switch{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.guide-switch button{border:1px solid #c6d7ce;background:white;border-radius:24px;padding:12px 18px;font-weight:700;cursor:pointer;color:#153e31}.guide-switch button[aria-pressed="true"]{background:#153e31;color:white}.guide-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.guide-pair figure{margin:0}.guide-pair img{display:block;width:100%;height:auto;border:1px solid #e4dfd6;border-radius:12px}.guide-pair figcaption{padding:10px 0;font-weight:700}.guide-pair a{display:block}.guide-back{display:inline-block;margin-bottom:16px;color:#153e31;font-weight:700}@media(max-width:650px){.guide-pair{grid-template-columns:1fr}}.guide-topnav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 28px}.guide-topnav a,.guide-topnav span{font-size:12px;padding:9px 11px;border-radius:9px;text-decoration:none;background:#e9eee7;color:#153e31;font-weight:700}.guide-topnav span{background:#153e31;color:white}</style></head><body><main class="guide-page"><a class="guide-back" href="./">← 返回電子菜單 · Back to Menu</a><nav class="guide-topnav"><a href="./#breakfast">早餐</a><a href="./#lunch">午餐</a><a href="./#tea">下午茶</a><a href="./#dinner">晚餐</a><a href="./#salad">沙律吧</a><a href="./#drinks">飲品</a><span aria-current="page">購餐指南</span></nav><div class="kicker">SORA ZEN · HOW TO ORDER</div><h1>購餐指南 · Ordering & Pickup</h1><p>按時段查看中英文購餐流程。點擊圖片可放大查看原圖。</p><div class="guide-switch" role="group" aria-label="選擇購餐時段"><button type="button" data-mode="lunch" aria-pressed="true">午市 · Lunch (11:00–15:00)</button><button type="button" data-mode="non-lunch" aria-pressed="false">其他時段 · Breakfast / Tea / Dinner</button></div><div id="guide-pair" class="guide-pair"></div></main><script>const guides={lunch:[['午市購餐指南 · 中文','guides/ordering-zh-lunch.png'],['Lunch Ordering Guide · English','guides/ordering-en-lunch.png']], 'non-lunch':[['早餐／下午茶／晚市指南 · 中文','guides/ordering-zh-non-lunch.png'],['Non-Lunch Ordering Guide · English','guides/ordering-en-non-lunch.png']]};function show(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('#guide-pair').innerHTML=guides[mode].map(([label,path])=>`<figure><figcaption>${label}</figcaption><a href="${path}" target="_blank" rel="noopener"><img src="${path}" alt="${label}"></a></figure>`).join('');location.hash=mode;}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.mode)));show(location.hash.slice(1)==='non-lunch'?'non-lunch':'lunch');</script></body></html>
